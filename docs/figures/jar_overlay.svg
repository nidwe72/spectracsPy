ial,sans-serif" font-size="11.5" fill="#1c211c" xml:space="preserve">the direct curve × 0.859</text><text x="490.0" y="440.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5c655c" xml:space="preserve">one constant, applied at every wavelength</text><text x="90.0" y="470.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#1c211c" xml:space="preserve">Where the dashed line hides under the green one — which is everywhere outside the clipped band — the jar has done nothing but dim the lamp.</text></svg>