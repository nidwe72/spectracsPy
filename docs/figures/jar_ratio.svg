.0" y="448.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.8" fill="#5c655c" xml:space="preserve">the same 18 DN cliff in both frames, 4 nm apart. Nothing in the light moved: the 452, 485 and 593 features are on the same nanometre</text></svg>