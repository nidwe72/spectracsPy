" cy="160.0" r="2.1" fill="#2f6b34"/><circle cx="227.0" cy="159.0" r="2.1" fill="#2f6b34"/><circle cx="256.0" cy="186.0" r="10.5" fill="#f0d089" stroke="#c9a233" stroke-width="1.2"/><circle cx="252.0" cy="183.0" r="2.1" fill="#2f6b34"/><circle cx="259.0" cy="182.0" r="2.1" fill="#2f6b34"/><circle cx="256.0" cy="188.0" r="2.1" fill="#2f6b34"/><circle cx="253.0" cy="190.0" r="2.1" fill="#2f6b34"/><circle cx="261.0" cy="189.0" r="2.1" fill="#2f6b34"/><circle cx="228.0" cy="216.0" r="10.5" fill="#f0d089" stroke="#c9a233" stroke-width="1.2"/><circle cx="224.0" cy="213.0" r="2.1" fill="#2f6b34"/><circle cx="231.0" cy="212.0" r="2.1" fill="#2f6b34"/><circle cx="228.0" cy="218.0" r="2.1" fill="#2f6b34"/><circle cx="225.0" cy="220.0" r="2.1" fill="#2f6b34"/><circle cx="233.0" cy="219.0" r="2.1" fill="#2f6b34"/><text x="106.0" y="266.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.0" fill="#5c655c" xml:space="preserve" text-anchor="middle">as prepared</text><text x="242.0" y="266.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.0" fill="#5c655c" xml:space="preserve" text-anchor="middle">diluted 2×</text><line x1="160.0" y1="180.0" x2="185.0" y2="180.0" stroke="#5c655c" stroke-width="1.6"/><path d="M 192.0 180.0 l -8 -4.5 l 0 9 Z" fill="#5c655c"/><text x="176.0" y="171.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.0" fill="#5c655c" xml:space="preserve" text-anchor="middle" font-style="italic">+ solvent</text><line x1="128.0" y1="186.0" x2="358.0" y2="182.0" stroke="#5c655c" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/><line x1="256.0" y1="186.0" x2="504.0" y2="198.0" stroke="#5c655c" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/><circle cx="410" cy="180" r="54" fill="#f0d089" stroke="#c9a233" stroke-width="2"/><circle cx="384.0" cy="162.0" r="5.2" fill="#2f6b34"/><circle cx="408.0" cy="153.0" r="5.2" fill="#2f6b34"/><circle cx="433.0" cy="166.0" r="5.2" fill="#2f6b34"/><circle cx="380.0" cy="188.0" r="5.2" fill="#2f6b34"/><circle cx="404.0" cy="178.0" r="5.2" fill="#2f6b34"/><circle cx="429.0" cy="190.0" r="5.2" fill="#2f6b34"/><circle cx="391.0" cy="209.0" r="5.2" fill="#2f6b34"/><circle cx="418.0" cy="207.0" r="5.2" fill="#2f6b34"/><circle cx="440.0" cy="148.0" r="5.2" fill="#2f6b34"/><text x="410.0" y="252.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.0" fill="#5c655c" xml:space="preserve" text-anchor="middle" font-weight="bold">1×</text><circle cx="556" cy="180" r="54" fill="#f0d089" stroke="#c9a233" stroke-width="2"/><circle cx="530.0" cy="162.0" r="5.2" fill="#2f6b34"/><circle cx="554.0" cy="153.0" r="5.2" fill="#2f6b34"/><circle cx="579.0" cy="166.0" r="5.2" fill="#2f6b34"/><circle cx="526.0" cy="188.0" r="5.2" fill="#2f6b34"/><circle cx="550.0" cy="178.0" r="5.2" fill="#2f6b34"/><circle cx="575.0" cy="190.0" r="5.2" fill="#2f6b34"/><circle cx="537.0" cy="209.0" r="5.2" fill="#2f6b34"/><circle cx="564.0" cy="207.0" r="5.2" fill="#2f6b34"/><circle cx="586.0" cy="148.0" r="5.2" fill="#2f6b34"/><text x="556.0" y="252.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.0" fill="#5c655c" xml:space="preserve" text-anchor="middle" font-weight="bold">½×</text><text x="483.0" y="190.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="30.0" fill="#3f7d3f" xml:space="preserve" text-anchor="middle" font-weight="bold">=</text><text x="483.0" y="272.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#5c655c" xml:space="preserve" text-anchor="middle" font-style="italic">inside one droplet — identical at both dilutions</text><text x="660.0" y="132.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#1c211c" xml:space="preserve" text-anchor="start" font-weight="bold">The droplet&#8217;s inside is fixed.</text><text x="660.0" y="154.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="start">Diluting changes only HOW MANY droplets sit</text><text x="660.0" y="170.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="start">in the beam — never the concentration inside</text><text x="660.0" y="186.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="start">one of them. Every concentration-dependent</text><text x="660.0" y="202.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="start">process (aggregation, dimerisation, self-</text><text x="660.0" y="218.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="start">quenching) is frozen at one operating point.</text><text x="660.0" y="256.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#3f7d3f" xml:space="preserve" text-anchor="start" font-weight="bold">⇒ invariance is STRUCTURAL</text><text x="660.0" y="274.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.0" fill="#5c655c" xml:space="preserve" text-anchor="start">measured at ±0.35 % across every dilution</text><text x="660.0" y="289.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.0" fill="#5c655c" xml:space="preserve" text-anchor="start">simulated, against an 8.7 % run-to-run spread</text><rect x="32" y="346" width="936" height="262" rx="7" fill="#f9f6f4"/><text x="48.0" y="370.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.0" fill="#b4472f" xml:space="preserve" text-anchor="start" font-weight="bold">B · WHITE SPIRIT — the oil dissolves; the pigment is loose in the solvent</text><rect x="60.0" y="388.0" width="92.0" height="132.0" rx="9" fill="#ffffff" stroke="#98a49c" stroke-width="1.6"/><path d="M 64.0 406.0 L 148.0 406.0 L 148.0 507.0 Q 148.0 516.0 139.0 516.0 L 73.0 516.0 Q 64.0 516.0 64.0 507.0 Z" fill="#eef3f7" stroke="#b9c7d2" stroke-width="1.1"/><rect x="196.0" y="388.0" width="92.0" height="132.0" rx="9" fill="#ffffff" stroke="#98a49c" stroke-width="1.6"/><path d="M 200.0 406.0 L 284.0 406.0 L 284.0 507.0 Q 284.0 516.0 275.0 516.0 L 209.0 516.0 Q 200.0 516.0 200.0 507.0 Z" fill="#eef3f7" stroke="#b9c7d2" stroke-width="1.1"/><circle cx="74.0" cy="424.0" r="3.0" fill="#2f6b34"/><circle cx="92.0" cy="420.0" r="3.0" fill="#2f6b34"/><circle cx="110.0" cy="426.0" r="3.0" fill="#2f6b34"/><circle cx="128.0" cy="422.0" r="3.0" fill="#2f6b34"/><circle cx="140.0" cy="432.0" r="3.0" fill="#2f6b34"/><circle cx="68.0" cy="442.0" r="3.0" fill="#2f6b34"/><circle cx="104.0" cy="444.0" r="3.0" fill="#2f6b34"/><circle cx="122.0" cy="440.0" r="3.0" fill="#2f6b34"/><circle cx="138.0" cy="450.0" r="3.0" fill="#2f6b34"/><circle cx="72.0" cy="460.0" r="3.0" fill="#2f6b34"/><circle cx="90.0" cy="456.0" r="3.0" fill="#2f6b34"/><circle cx="108.0" cy="462.0" r="3.0" fill="#2f6b34"/><circle cx="126.0" cy="458.0" r="3.0" fill="#2f6b34"/><circle cx="142.0" cy="466.0" r="3.0" fill="#2f6b34"/><circle cx="66.0" cy="478.0" r="3.0" fill="#2f6b34"/><circle cx="84.0" cy="476.0" r="3.0" fill="#2f6b34"/><circle cx="102.0" cy="480.0" r="3.0" fill="#2f6b34"/><circle cx="120.0" cy="476.0" r="3.0" fill="#2f6b34"/><circle cx="136.0" cy="486.0" r="3.0" fill="#2f6b34"/><circle cx="78.0" cy="494.0" r="3.0" fill="#2f6b34"/><circle cx="96.0" cy="496.0" r="3.0" fill="#2f6b34"/><circle cx="114.0" cy="494.0" r="3.0" fill="#2f6b34"/><circle cx="132.0" cy="498.0" r="3.0" fill="#2f6b34"/><circle cx="86.0" cy="438.0" r="3.6" fill="#b4472f"/><circle cx="93.0" cy="442.0" r="3.6" fill="#b4472f"/><circle cx="216.0" cy="426.0" r="3.0" fill="#2f6b34"/><circle cx="244.0" cy="420.0" r="3.0" fill="#2f6b34"/><circle cx="268.0" cy="434.0" r="3.0" fill="#2f6b34"/><circle cx="232.0" cy="440.0" r="3.0" fill="#2f6b34"/><circle cx="210.0" cy="452.0" r="3.0" fill="#2f6b34"/><circle cx="240.0" cy="458.0" r="3.0" fill="#2f6b34"/><circle cx="272.0" cy="464.0" r="3.0" fill="#2f6b34"/><circle cx="220.0" cy="480.0" r="3.0" fill="#2f6b34"/><circle cx="250.0" cy="484.0" r="3.0" fill="#2f6b34"/><circle cx="276.0" cy="496.0" r="3.0" fill="#2f6b34"/><circle cx="214.0" cy="496.0" r="3.0" fill="#2f6b34"/><circle cx="244.0" cy="498.0" r="3.0" fill="#2f6b34"/><text x="106.0" y="542.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.0" fill="#5c655c" xml:space="preserve" text-anchor="middle">as prepared</text><text x="242.0" y="542.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.0" fill="#5c655c" xml:space="preserve" text-anchor="middle">diluted 2×</text><line x1="160.0" y1="456.0" x2="185.0" y2="456.0" stroke="#5c655c" stroke-width="1.6"/><path d="M 192.0 456.0 l -8 -4.5 l 0 9 Z" fill="#5c655c"/><text x="176.0" y="447.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.0" fill="#5c655c" xml:space="preserve" text-anchor="middle" font-style="italic">+ solvent</text><line x1="142.0" y1="466.0" x2="358.0" y2="460.0" stroke="#5c655c" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/><line x1="272.0" y1="464.0" x2="504.0" y2="472.0" stroke="#5c655c" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/><circle cx="410" cy="456" r="54" fill="#eef3f7" stroke="#b9c7d2" stroke-width="2"/><circle cx="380.0" cy="436.0" r="5.2" fill="#2f6b34"/><circle cx="402.0" cy="426.0" r="5.2" fill="#2f6b34"/><circle cx="426.0" cy="434.0" r="5.2" fill="#2f6b34"/><circle cx="378.0" cy="462.0" r="5.2" fill="#2f6b34"/><circle cx="400.0" cy="452.0" r="5.2" fill="#2f6b34"/><circle cx="424.0" cy="460.0" r="5.2" fill="#2f6b34"/><circle cx="388.0" cy="484.0" r="5.2" fill="#2f6b34"/><circle cx="416.0" cy="480.0" r="5.2" fill="#2f6b34"/><circle cx="440.0" cy="476.0" r="5.2" fill="#2f6b34"/><circle cx="400.0" cy="452.0" r="6.0" fill="#b4472f"/><circle cx="411.0" cy="458.0" r="6.0" fill="#b4472f"/><text x="410.0" y="528.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.0" fill="#5c655c" xml:space="preserve" text-anchor="middle" font-weight="bold">1×</text><circle cx="556" cy="456" r="54" fill="#eef3f7" stroke="#b9c7d2" stroke-width="2"/><circle cx="528.0" cy="434.0" r="5.2" fill="#2f6b34"/><circle cx="570.0" cy="438.0" r="5.2" fill="#2f6b34"/><circle cx="550.0" cy="462.0" r="5.2" fill="#2f6b34"/><circle cx="582.0" cy="474.0" r="5.2" fill="#2f6b34"/><circle cx="532.0" cy="482.0" r="5.2" fill="#2f6b34"/><text x="556.0" y="528.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.0" fill="#5c655c" xml:space="preserve" text-anchor="middle" font-weight="bold">½×</text><text x="483.0" y="466.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="30.0" fill="#b4472f" xml:space="preserve" text-anchor="middle" font-weight="bold">≠</text><text x="483.0" y="548.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#5c655c" xml:space="preserve" text-anchor="middle" font-style="italic">the spacing between pigment molecules really changes</text><text x="660.0" y="408.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#1c211c" xml:space="preserve" text-anchor="start" font-weight="bold">The pigment&#8217;s real concentration is the nominal one.</text><text x="660.0" y="430.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="start">Halve it and the molecules sit ≈ 1.26× further</text><text x="660.0" y="446.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="start">apart (the cube root of two), so the same</text><text x="660.0" y="462.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="start">processes are now live variables. In a dry</text><text x="660.0" y="478.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="start">hydrocarbon the magnesium can take its fifth</text><text x="660.0" y="494.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="start">ligand from a NEIGHBOUR — a dimer, with shifted,</text><text x="660.0" y="510.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="start">broadened bands, and a concentration-dependent</text><text x="660.0" y="526.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="start">equilibrium behind it.</text><text x="660.0" y="554.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#b4472f" xml:space="preserve" text-anchor="start" font-weight="bold">⇒ invariance becomes CONDITIONAL — untested</text><text x="660.0" y="572.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.0" fill="#5c655c" xml:space="preserve" text-anchor="start">arm B (three dilutions, both solvents) never ran</text><line x1="32" y1="622" x2="968" y2="622" stroke="#d8ded8"/><text x="32.0" y="641.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="start">The emulsion does NOT read the true spectrum — it reads a wrong one, consistently. That is exactly what a ratio metric survives:</text><text x="32.0" y="657.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#5c655c" xml:space="preserve" text-anchor="start">constant-but-wrong beats variable-but-right. Four arguments say the dimer never forms at micromolar in wet hardware-shop solvent — but they are arguments, not measurements.</text></svg>