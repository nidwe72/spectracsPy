<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 672" width="1000" height="672"><rect width="1000" height="672" fill="#ffffff"/><text x="500.0" y="28.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="17.0" fill="#1c211c" xml:space="preserve" text-anchor="middle" font-weight="bold">Why isopropanol&#8217;s dilution-invariance is structural &#8212; and white spirit&#8217;s is not</text><text x="500.0" y="48.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.0" fill="#5c655c" xml:space="preserve" text-anchor="middle" font-style="italic">a mechanism drawing, not measured data · the experiment that would settle it (arm B) has not run</text><rect x="32" y="70" width="936" height="262" rx="7" fill="#f5f8f5"/><text x="48.0" y="94.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.0" fill="#3f7d3f" xml:space="preserve" text-anchor="start" font-weight="bold">A · ISOPROPANOL — the oil does not dissolve; the pigment rides inside droplets</text><rect x="60.0" y="112.0" width="92.0" height="132.0" rx="9" fill="#ffffff" stroke="#98a49c" stroke-width="1.6"/><path d="M 64.0 130.0 L 148.0 130.0 L 148.0 231.0 Q 148.0 240.0 139.0 240.0 L 73.0 240.0 Q 64.0 240.0 64.0 231.0 Z" fill="#fbfdfb" stroke="#d6e0d6" stroke-width="1.1"/><rect x="196.0" y="112.0" width="92.0" height="132.0" rx="9" fill="#ffffff" stroke="#98a49c" stroke-width="1.6"/><path d="M 200.0 130.0 L 284.0 130.0 L 284.0 231.0 Q 284.0 240.0 275.0 240.0 L 209.0 240.0 Q 200.0 240.0 200.0 231.0 Z" fill="#fbfdfb" stroke="#d6e0d6" stroke-width="1.1"/><circle cx="80.0" cy="150.0" r="10.5" fill="#f0d089" stroke="#c9a233" stroke-width="1.2"/><circle cx="76.0" cy="147.0" r="2.1" fill="#2f6b34"/><circle cx="83.0" cy="146.0" r="2.1" fill="#2f6b34"/><circle cx="80.0" cy="152.0" r="2.1" fill="#2f6b34"/><circle cx="77.0" cy="154.0" r="2.1" fill="#2f6b34"/><circle cx="85.0" cy="153.0" r="2.1" fill="#2f6b34"/><circle cx="118.0" cy="146.0" r="10.5" fill="#f0d089" stroke="#c9