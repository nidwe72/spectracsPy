<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 890" width="980" height="890"><rect width="980" height="890" fill="#ffffff"/><text x="490.0" y="30.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="18.0" fill="#1c211c" xml:space="preserve" text-anchor="middle" font-weight="bold">A muddy jar goes in — what happens next</text><text x="490.0" y="52.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.5" fill="#5c655c" xml:space="preserve" text-anchor="middle" font-style="italic">one fill · one wait · one best measurement</text><rect x="26.0" y="68" width="132.0" height="30" rx="5" fill="#f5f8f5" stroke="#b9c1b9"/><text x="92.0" y="88.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="middle" font-weight="bold">the OPERATOR</text><line x1="92.0" y1="98" x2="92.0" y2="856" stroke="#b9c1b9" stroke-width="1" stroke-dasharray="3 4"/><rect x="166.0" y="68" width="132.0" height="30" rx="5" fill="#f5f8f5" stroke="#b9c1b9"/><text x="232.0" y="88.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="middle" font-weight="bold">the JAR</text><line x1="232.0" y1="98" x2="232.0" y2="856" stroke="#b9c1b9" stroke-width="1" stroke-dasharray="3 4"/><rect x="326.0" y="68" width="132.0" height="30" rx="5" fill="#f5f8f5" stroke="#b9c1b9"/><text x="392.0" y="88.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="middle" font-weight="bold">the INSTRUMENT</text><line x1="392.0" y1="98" x2="392.0" y2="856" stroke="#b9c1b9" stroke-width="1" stroke-dasharray="3 4"/><rect x="500.0" y="68" width="132.0" height="30" rx="5" fill="#f5f8f5" stroke="#b9c1b9"/><text x="566.0" y="88.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="middle" font-weight="bold">MonitorEngine</text><line x1="566.0" y1="98" x2="566.0" y2="856" stroke="#b9c1b9" stroke-width="1" stroke-dasharray="3 4"/><rect x="676.0" y="68" width="132.0" height="30" rx="5" fill="#f5f8f5" stroke="#b9c1b9"/><text x="742.0" y="88.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="middle" font-weight="bold">ClearingEvaluator</text><line x1="742.0" y1="98" x2="742.0" y2="856" stroke="#b9c1b9" stroke-width="1" stroke-dasharray="3 4"/><rect x="818.0" y="68" width="132.0" height="30" rx="5" fill="#f5f8f5" stroke="#b9c1b9"/><text x="884.0" y="88.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1c211c" xml:space="preserve" text-anchor="middle" font-weight="bold">the REPORT</text><line x1="884.0" y1="98" x2="884.0" y2="856" stroke="#b9c1b9" stroke-width="1" stroke-dasharray="3 4"/><line x1="92.0" y1="128.0" x2="232.0" y2="128.0" stroke="#2f5d2f" stroke-width="1.6"/><polygon points="232.0,128.0 225.0,124.0 225.0,132.0" fill="#2f5d2f"/><text x="162.0" y="122.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#2f5d2f" xml:space="preserve" text-anchor="middle" font-weight="bold">dilute · fill</text><text x="162.0" y="141.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.0" fill="#5c655c" xml:space="preserve" text-anchor="middle" font-style="italic">2 capillaries / 10 mL</text><line x1="232.0" y1="174.0" x2="392.0" y2="174.0" stroke="#2f5d2f" stroke-width="1.6"/><polygon points="392.0,174.0 385.0,170.0 385.0,178.0" fill="#2f5d2f"/><text x="312.0" y="168.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#2f5d2f" xml:space="preserve" text-anchor="middle" font-weight="bold">insert the MUDDY jar</text><text x="312.0" y="187.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.0" fill="#5c655c" xml:space="preserve" text-anchor="middle" font-style="italic">it is a suspension, not a solution</text><line x1="92.0" y1="220.0" x2="392.0" y2="220.0" stroke="#2f5d2f" stroke-width="1.6"/><polygon points="392.0,220.0 385.0,216.0 385.0,224.0" fill="#2f5d2f"/><text x="242.0" y="214.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#2f5d2f" xml:space="preserve" text-anchor="middle" font-weight="bold">start</text><rect x="308.0" y="243.0" width="168.0" height="26" rx="4" fill="#eef3ee" stroke="#3f7d3f"/><text x="392.0" y="260.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#2f5d2f" xml:space="preserve" text-anchor="middle" font-weight="bold">capture the REFERENCE, once</text><rect x="262.0" y="294.0" width="650.0" height="330" rx="7" fill="none" stroke="#3a5fa8" stroke-width="1.4"/><rect x="262.0" y="294.0" width="150" height="20" fill="#3a5fa8"/><text x="268.0" y="308.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#ffffff" xml:space="preserve" font-weight="bold">loop — every 60 frames</text><line x1="392.0" y1="338.0" x2="566.0" y2="338.0" stroke="#3a5fa8" stroke-width="1.6"/><polygon points="566.0,338.0 559.0,334.0 559.0,342.0" fill="#3a5fa8"/><text x="479.0" y="332.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#3a5fa8" xml:space="preserve" text-anchor="middle" font-weight="bold">offer(spectrum, t)</text><line x1="566.0" y1="378.0" x2="742.0" y2="378.0" stroke="#3a5fa8" stroke-width="1.6"/><polygon points="742.0,378.0 735.0,374.0 735.0,382.0" fill="#3a5fa8"/><text x="654.0" y="372.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#3a5fa8" xml:space="preserve" text-anchor="middle" font-weight="bold">decide(rows)</text><rect x="698.0" y="396.0" width="250" height="46" rx="4" fill="#eef2f8" stroke="#3a5fa8"/><text x="708.0" y="412.0" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="10.5" fill="#3a5fa8" xml:space="preserve" font-weight="bold">A_Soret · A_valley · A_Q  →  Q%</text><text x="708.0" y="428.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.0" fill="#5c655c" xml:space="preserve" font-style="italic">one row appended to the trajectory</text><polygon points="624.0,474.0 642.0,463.0 660.0,474.0 642.0,485.0" fill="#ffffff" stroke="#b03a3a"/><text x="666.0" y="478.0" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="10.0" fill="#b03a3a" xml:space="preserve" font-weight="bold">A_Soret &lt; 0.15</text><text x="666.0" y="492.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.0" fill="#5c655c" xml:space="preserve" font-style="italic">MEASUREMENT_BROKEN — abort; there is nothing in the cuvette</text><polygon points="624.0,514.0 642.0,503.0 660.0,514.0 642.0,525.0" fill="#ffffff" stroke="#b8860b"/><text x="666.0" y="518.0" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="10.0" fill="#b8860b" xml:space="preserve" font-weight="bold">too dark to read</text><text x="666.0" y="532.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.0" fill="#5c655c" xml:space="preserve" font-style="italic">not a look, and NOT broken — the fill is still clearing</text><polygon points="624.0,554.0 642.0,543.0 660.0,554.0 642.0,565.0" fill="#ffffff" stroke="#b8860b"/><text x="666.0" y="558.0" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="10.0" fill="#b8860b" xml:space="preserve" font-weight="bold">TEST C — a monotone RISE</text><text x="666.0" y="572.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.0" fill="#5c655c" xml:space="preserve" font-style="italic">DEGRADING_FILL — it is ripening, not settling. End the run</text><polygon points="624.0,594.0 642.0,583.0 660.0,594.0 642.0,605.0" fill="#ffffff" stroke="#2f5d2f"/><text x="666.0" y="598.0" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="10.0" fill="#2f5d2f" xml:space="preserve" font-weight="bold">TEST A — flat, twice</text><text x="666.0" y="612.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.0" fill="#5c655c" xml:space="preserve" font-style="italic">the GATE fires — |dA_valley/dt| &lt; 0.005/min ⇒ stop looking</text><text x="272.0" y="612.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#5c655c" xml:space="preserve" font-style="italic">…otherwise: carry on, capture the next window</text><line x1="566.0" y1="652.0" x2="742.0" y2="652.0" stroke="#2f5d2f" stroke-width="1.6"/><polygon points="742.0,652.0 735.0,648.0 735.0,656.0" fill="#2f5d2f"/><text x="654.0" y="646.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#2f5d2f" xml:space="preserve" text-anchor="middle" font-weight="bold">finalize(rows)   ⭐ the END-OF-RUN read</text><text x="654.0" y="665.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.0" fill="#5c655c" xml:space="preserve" text-anchor="middle" font-style="italic">a minimum the curve later fell below was never a minimum</text><rect x="680.0" y="678.0" width="286" height="60" rx="5" fill="#eef3ee" stroke="#3f7d3f"/><text x="690.0" y="696.0" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="10.0" fill="#2f5d2f" xml:space="preserve" font-weight="bold">the curve turned  →  VERTEX at the minimum</text><text x="690.0" y="711.0" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="10.0" fill="#2f5d2f" xml:space="preserve" font-weight="bold">it never turned  →  the FIRST look</text><text x="690.0" y="728.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.0" fill="#5c655c" xml:space="preserve" font-style="italic">drawdown ≤ 10 × tailSd, or the candidate is refused</text><line x1="742.0" y1="770.0" x2="566.0" y2="770.0" stroke="#2f5d2f" stroke-width="1.6"/><polygon points="566.0,770.0 573.0,766.0 573.0,774.0" fill="#2f5d2f"/><text x="654.0" y="764.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#2f5d2f" xml:space="preserve" text-anchor="middle">answer + readAs + branch</text><line x1="566.0" y1="804.0" x2="884.0" y2="804.0" stroke="#2f5d2f" stroke-width="1.6"/><polygon points="884.0,804.0 877.0,800.0 877.0,808.0" fill="#2f5d2f"/><text x="725.0" y="798.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#2f5d2f" xml:space="preserve" text-anchor="middle" font-weight="bold">MonitorRecord</text><text x="725.0" y="817.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.0" fill="#5c655c" xml:space="preserve" text-anchor="middle" font-style="italic">outcome · every row · the version of the rule</text><rect x="684.0" y="827.0" width="220" height="26" rx="4" fill="#fdf3f3" stroke="#b03a3a"/><text x="694.0" y="844.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.0" fill="#b03a3a" xml:space="preserve" font-weight="bold">no value?  the record says WHY</text></svg>