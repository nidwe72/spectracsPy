<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 452" width="940" height="452"><rect width="940" height="452" fill="#ffffff"/><text x="470.0" y="30.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="16.0" fill="#2f5d2f" xml:space="preserve" text-anchor="middle" font-weight="700">Why the loss is grey: four surfaces, no absorber</text><text x="470.0" y="49.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5c655c" xml:space="preserve" text-anchor="middle">a reflection at an index step is nearly wavelength-flat across the visible; an absorber never is</text><rect x="274" y="88" width="258" height="120" fill="#fbfdfb" stroke="#b9c1b9"/><rect x="244" y="88" width="30" height="120" fill="#dfe6ee" stroke="#b9c1b9"/><text x="259.0" y="77.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.0" fill="#5c655c" xml:space="preserve" text-anchor="middle">wall 1</text><rect x="532" y="88" width="30" height="120" fill="#dfe6ee" stroke="#b9c1b9"/><text x="547.0" y="77.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.0" fill="#5c655c" xml:space="preserve" text-anchor="middle">wall 2</text><text x="403.0" y="77.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.0" fill="#5c655c" xml:space="preserve" text-anchor="middle">the fill</text><line x1="86" y1="148" x2="244" y2="148" stroke="#3f7d3f" stroke-width="2.4"/><line x1="562" y1="148" x2="700" y2="148" stroke="#3f7d3f" stroke-width="2.4"/><line x1="274" y1="148" x2="532" y2="148" stroke="#3f7d3f" stroke-width="2.0" stroke-dasharray="4 3"/><line x1="274" y1="148" x2="244" y2="148" stroke="#3f7d3f" stroke-width="1.2" stroke-dasharray="2 3"/><line x1="562" y1="148" x2="532" y2="148" stroke="#3f7d3f" stroke-width="1.2" stroke-dasharray="2 3"/><text x="86.0" y="134.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.0" fill="#1c211c" xml:space="preserve" font-weight="700">lamp</text><text x="700.0" y="134.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.0" fill="#1c211c" xml:space="preserve" text-anchor="end" font-weight="700">sensor</text><line x1="244" y1="148" x2="222" y2="108" stroke="#b03a3a" stroke-width="2.0"/><polygon points="222,108 229,116 219,118" fill="#b03a3a"/><circle cx="244" cy="236" r="10" fill="#ffffff" stroke="#b03a3a" stroke-width="1.4"/><text x="244.0" y="240.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.0" fill="#b03a3a" xml:space="preserve" text-anchor="middle" font-weight="700">1</text><line x1="274" y1="148" x2="252" y2="108" stroke="#b03a3a" stroke-width="2.0"/><polygon points="252,108 259,116 249,118" fill="#b03a3a"/><circle cx="274" cy="236" r="10" fill="#ffffff" stroke="#b03a3a" stroke-width="1.4"/><text x="274.0" y="240.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.0" fill="#b03a3a" xml:space="preserve" text-anchor="middle" font-weight="700">2</text><line x1="532" y1="148" x2="510" y2="108" stroke="#b03a3a" stroke-width="2.0"/><polygon points="510,108 517,116 507,118" fill="#b03a3a"/><circle cx="532" cy="236" r="10" fill="#ffffff" stroke="#b03a3a" stroke-width="1.4"/><text x="532.0" y="240.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.0" fill="#b03a3a" xml:space="preserve" text-anchor="middle" font-weight="700">3</text><line x1="562" y1="148" x2="540" y2="108" stroke="#b03a3a" stroke-width="2.0"/><polygon points="540,108 547,116 537,118" fill="#b03a3a"/><circle cx="562" cy="236" r="10" fill="#ffffff" stroke="#b03a3a" stroke-width="1.4"/><text x="562.0" y="240.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.0" fill="#b03a3a" xml:space="preserve" text-anchor="middle" font-weight="700">4</text><text x="403.0" y="270.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#b03a3a" xml:space="preserve" text-anchor="middle">four index steps, each turning about 4 % of the beam straight back</text><rect x="732" y="82" width="182" height="238" fill="#f5f8f5" stroke="#b9c1b9" rx="6"/><text x="823.0" y="106.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12.0" fill="#2f5d2f" xml:space="preserve" text-anchor="middle" font-weight="700">T through two walls</text><text x="746.0" y="132.0" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="11.0" fill="#1c211c" xml:space="preserve" font-weight="700">n 1.490</text><text x="900.0" y="132.0" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="11.0" fill="#2f5d2f" xml:space="preserve" text-anchor="end" font-weight="700">0.856</text><text x="746.0" y="147.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#5c655c" xml:space="preserve">PMMA / polypropylene</text><text x="746.0" y="172.0" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="11.0" fill="#5c655c" xml:space="preserve">n 1.520</text><text x="900.0" y="172.0" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="11.0" fill="#5c655c" xml:space="preserve" text-anchor="end">0.843</text><text x="746.0" y="187.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#5c655c" xml:space="preserve">soda-lime glass</text><text x="746.0" y="212.0" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="11.0" fill="#5c655c" xml:space="preserve">n 1.585</text><text x="900.0" y="212.0" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="11.0" fill="#5c655c" xml:space="preserve" text-anchor="end">0.815</text><text x="746.0" y="227.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#5c655c" xml:space="preserve">polycarbonate</text><text x="746.0" y="252.0" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="11.0" fill="#5c655c" xml:space="preserve">n 1.590</text><text x="900.0" y="252.0" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="11.0" fill="#5c655c" xml:space="preserve" text-anchor="end">0.812</text><text x="746.0" y="267.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#5c655c" xml:space="preserve">polystyrene</text><line x1="742" y1="278" x2="904" y2="278" stroke="#b9c1b9"/><text x="746.0" y="298.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.0" fill="#b03a3a" xml:space="preserve" font-weight="700">measured</text><text x="900.0" y="298.0" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="11.0" fill="#b03a3a" xml:space="preserve" text-anchor="end" font-weight="700">0.859</text><text x="78.0" y="344.0" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13.0" fill="#1c211c" xml:space="preserve">T = ( (1 − R) / (1 + R) )²      with      R = ( (n − 1) / (n + 1) )²</text><text x="78.0" y="374.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5c655c" xml:space="preserve">The measured 0.859 lands on n ≈ 1.48. Polystyrol (n = 1.59) predicts 0.812 — five points of transmission lower than what was seen.</text><text x="78.0" y="400.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5c655c" xml:space="preserve">⚠ A consistency check, not an assay of the plastic: the walls are curved, so part of the loss is light refracted out of the ROI rather than</text><text x="78.0" y="418.0" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" fill="#5c655c" xml:space="preserve">reflected — and an exposure difference between the two frames would move the measured number without the jar moving at all.</text></svg>